<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="pwaGlow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#pwaGrad512)" stroke-width="6" stroke-opacity="0.4"/>
  
  <g transform="translate(106, 110)">
    <!-- Dumbbell Bar -->
    <path d="M40 100 L260 100" stroke="url(#pwaGrad512)" stroke-width="28" stroke-linecap="round"/>
    
    <!-- Left Weight Plates -->
    <rect x="40" y="55" width="32" height="90" rx="12" fill="#10b981"/>
    <rect x="12" y="70" width="24" height="60" rx="10" fill="#059669"/>
    
    <!-- Right Weight Plates -->
    <rect x="228" y="55" width="32" height="90" rx="12" fill="#4f46e5"/>
    <rect x="264" y="70" width="24" height="60" rx="10" fill="#6366f1"/>
    
    <!-- Center Knurling Grips -->
    <line x1="120" y1="88" x2="120" y2="112" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <line x1="150" y1="88" x2="150" y2="112" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <line x1="180" y1="88" x2="180" y2="112" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Peak / Lightning Bolt Emblem -->
    <polygon points="150,150 166,190 146,190 156,230 126,180 142,180" fill="#10b981" filter="url(#pwaGlow512)"/>
  </g>
  
  <text x="256" y="420" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">IRONPEAK</text>
  <text x="256" y="456" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#10b981" letter-spacing="8">ELITE MANAGEMENT</text>
</svg>
