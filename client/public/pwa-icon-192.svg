<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="pwaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="192" height="192" rx="44" fill="#0f172a"/>
  <rect x="6" y="6" width="180" height="180" rx="38" fill="none" stroke="url(#pwaGrad)" stroke-width="3" stroke-opacity="0.4"/>
  <g transform="translate(40, 40)">
    <!-- Dumbbell / IronPeak Icon -->
    <path d="M18 42 L94 42" stroke="url(#pwaGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Left Weight Plates -->
    <rect x="18" y="24" width="14" height="36" rx="5" fill="#10b981"/>
    <rect x="6" y="30" width="10" height="24" rx="4" fill="#059669"/>
    <!-- Right Weight Plates -->
    <rect x="80" y="24" width="14" height="36" rx="5" fill="#4f46e5"/>
    <rect x="96" y="30" width="10" height="24" rx="4" fill="#6366f1"/>
    <!-- Center Grip Rings -->
    <line x1="48" y1="36" x2="48" y2="48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="64" y1="36" x2="64" y2="48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <!-- Lightning Bolt / Peak Accent -->
    <polygon points="56,66 62,82 54,82 58,98 46,78 52,78" fill="#10b981" filter="url(#pwaGlow)"/>
  </g>
  <text x="96" y="160" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="1">IRONPEAK</text>
</svg>
